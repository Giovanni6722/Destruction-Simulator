<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sandbox Physics</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Sandbox Physics</h1>
      <div class="layout">
        <aside class="sidebar" aria-label="Drawing tools">
          <section>
            <h2>Elements</h2>
            <div id="materials" role="group" aria-label="Material"></div>
          </section>
          <label class="brush-size">Brush size <input id="brush" type="range" min="1" max="5" value="2" /></label>
          <section>
            <h2>Shape</h2>
            <div id="shapes" role="group" aria-label="Brush shape">
              <button type="button" data-shape="circle" aria-label="Circle" title="Circle" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" /></svg></button>
              <button type="button" data-shape="star" aria-label="Star" title="Star" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 2.9 6.2 6.8.8-5 4.7 1.3 6.7L12 17l-6 3.4 1.3-6.7-5-4.7 6.8-.8z" /></svg></button>
              <button type="button" data-shape="square" aria-label="Square" title="Square" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" /></svg></button>
              <button type="button" data-shape="rectangle" aria-label="Rectangle" title="Rectangle" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="7" width="20" height="10" /></svg></button>
              <button type="button" data-shape="trapezoid" aria-label="Trapezoid" title="Trapezoid" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10l5 16H2z" /></svg></button>
            </div>
          </section>
        </aside>
        <div class="workspace">
          <div class="toolbar">
            <label>
              Speed
              <select id="speed">
                <option value="0.25">¼×</option>
                <option value="1" selected>1×</option>
                <option value="2">2×</option>
                <option value="4">4×</option>
              </select>
            </label>
            <button id="pause">Pause</button>
            <button id="step" disabled>Step</button>
            <button id="undo" disabled>Undo</button>
            <button id="erase" aria-pressed="false">Erase</button>
            <button id="clear">Clear</button>
          </div>
          <p id="stats" class="note"></p>
          <canvas id="canvas" width="120" height="90" role="img" aria-label="Physics sandbox: drag to paint, right-click and drag to erase"></canvas>
          <p class="note">Drag to paint · right-click and drag to erase · hold still to keep pouring</p>
        </div>
      </div>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>

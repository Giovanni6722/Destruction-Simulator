<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sandbox Physics</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header class="banner">
        <h1>Sandbox Physics</h1>
      </header>
      <div class="layout">
        <aside class="sidebar" aria-label="Drawing tools">
          <section class="panel">
            <h2>Elements</h2>
            <div id="materials" role="group" aria-label="Material"></div>
          </section>
          <section class="panel">
            <h2><label for="brush">Brush size</label></h2>
            <div><input id="brush" type="range" min="1" max="5" value="2" /></div>
          </section>
          <section class="panel">
            <h2>Shape</h2>
            <div id="shapes" role="group" aria-label="Brush shape">
              <button type="button" data-shape="circle" aria-label="Circle" title="Circle" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" /></svg></button>
              <button type="button" data-shape="star" aria-label="Star" title="Star" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 2.9 6.2 6.8.8-5 4.7 1.3 6.7L12 17l-6 3.4 1.3-6.7-5-4.7 6.8-.8z" /></svg></button>
              <button type="button" data-shape="square" aria-label="Square" title="Square" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" /></svg></button>
              <button type="button" data-shape="rectangle" aria-label="Rectangle" title="Rectangle" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="7" width="20" height="10" /></svg></button>
              <button type="button" data-shape="trapezoid" aria-label="Trapezoid" title="Trapezoid" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10l5 16H2z" /></svg></button>
            </div>
          </section>
        </aside>
        <div class="workspace">
          <section class="panel">
            <h2>Controls</h2>
            <div class="toolbar">
              <label>
                Speed
                <select id="speed">
                  <option value="0.25">¼×</option>
                  <option value="1" selected>1×</option>
                  <option value="2">2×</option>
                  <option value="4">4×</option>
                </select>
              </label>
              <button id="pause">Pause</button>
              <button id="step" disabled>Step</button>
              <button id="undo" disabled>Undo</button>
              <button id="erase" aria-pressed="false">Erase</button>
              <button id="clear">Clear</button>
              <button id="post-build" class="gold">Post Build</button>
              <button id="browse-builds">Browse Builds</button>
            </div>
          </section>
          <div class="screen">
            <canvas id="canvas" width="120" height="90" role="img" aria-label="Physics sandbox: drag to paint, right-click and drag to erase"></canvas>
          </div>
          <footer class="statusbar">
            <p class="note">Drag to paint · right-click and drag to erase · hold still to keep pouring</p>
            <p id="stats" class="note"></p>
          </footer>
        </div>
      </div>
    </main>
    <dialog id="post-dialog" class="panel" aria-labelledby="post-heading">
      <h2 id="post-heading">Post your build</h2>
      <form id="post-form">
        <fieldset id="login-fields" hidden disabled>
          <legend>Log in to post (or make an account)</legend>
          <label>Username <input name="username" autocomplete="username" required /></label>
          <label>Password <input name="password" type="password" autocomplete="current-password" required /></label>
          <label>Email (new accounts only) <input name="email" type="email" autocomplete="email" /></label>
          <button type="submit" id="register">Register &amp; post</button>
        </fieldset>
        <label>Title <input name="title" maxlength="100" required /></label>
        <label>Description <textarea name="description" rows="3" maxlength="500"></textarea></label>
        <p id="post-message" class="message" role="status" aria-live="polite"></p>
        <div class="toolbar">
          <button type="submit" id="post-submit" class="gold">Post</button>
          <button type="button" data-close>Close</button>
        </div>
      </form>
    </dialog>
    <dialog id="gallery-dialog" class="panel" aria-labelledby="gallery-heading">
      <h2 id="gallery-heading">Builds gallery</h2>
      <div>
        <ul id="gallery-list"></ul>
        <button type="button" data-close>Close</button>
      </div>
    </dialog>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
